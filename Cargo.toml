[workspace]
    members=["apps/rvpn-client", "apps/rvpn-server", "crates/rvpn-transport"]
    resolver="3"

    [workspace.package]
        authors=["Frank1o3"]
        edition="2024"
        license="BSD-3-Clause"
        version="0.0.1"

    [workspace.dependencies]
        anyhow="1.0"
        bytes="1.12.1"
        hex="0.4.3"
        rand="0.10.2"
        serde={version="1.0", features=["derive"]}
        sha2="0.11.0"
        socket2="0.6.5"
        thiserror="2.0"
        tokio={version="1.53.1", features=["macros", "net", "rt-multi-thread", "sync", "time"]}
        toml="1.1.6"
        tracing="0.1.44"
        tracing-subscriber="0.3.23"
        zeroize="1.9.0"
