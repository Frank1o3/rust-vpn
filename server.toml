# RVPN Server configuration
# Run on the laptop (LAN IP: 10.0.0.91)
bind="0.0.0.0:9000"
pre_shared_key="3e0f85e0f68e241b1b52d2c5429bf41a6c85845b6f0aa7b8c8d905723f917cc6"

[interface]
    address="10.42.0.1/24"
    mode="tun"
    mtu=1400
    name="rvpn-server0"

[forwarding]
    # Enable NAT masquerade and forwarding to route client internet traffic through the laptop
    enabled=true
    # Backend options: "auto" (probes for nft, falls back to iptables), "iptables", or "nftables"
    backend="auto"
    # Replace with the laptop's outgoing network interface (e.g. wlan0 or eth0):
    external_interface="enp0s31f6"
    tunnel_cidr="10.42.0.0/24"
    tunnel_cidr_v6="fd42::/64"

