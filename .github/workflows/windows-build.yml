name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build RVPN Windows Client
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      TARGET: x86_64-pc-windows-msvc
      WINTUN_VERSION: "0.14.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build RVPN client
        run: cargo build --release -p rvpn-client --target $env:TARGET

      - name: Download Wintun
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:RUNNER_TEMP\wintun.zip"

          Expand-Archive `
            -Path "$env:RUNNER_TEMP\wintun.zip" `
            -DestinationPath "$env:RUNNER_TEMP\wintun"

      - name: Package Windows client
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\rvpn-windows-x86_64"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Copy-Item `
            "target\$env:TARGET\release\rvpn-client.exe" `
            "$package\rvpn-client.exe"

          Copy-Item `
            "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" `
            "$package\wintun.dll"

          @"
          RVPN Windows Client

          Architecture:
            x86_64 / amd64

          Files:
            rvpn-client.exe
            wintun.dll

          Usage:
            Run rvpn-client.exe with your client.toml:

              rvpn-client.exe client.toml

          Requirements:
            - Windows 10/11
            - Administrator privileges
            - A valid RVPN client.toml
          "@ | Set-Content "$package\README.txt" -Encoding utf8

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "rvpn-windows-x86_64\*" `
            -DestinationPath "rvpn-windows-x86_64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-windows-x86_64
          path: rvpn-windows-x86_64.zip
          if-no-files-found: error