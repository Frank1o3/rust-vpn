name: RVPN Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install native nftables dependencies
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev libnftnl-dev libglib2.0-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
