name: RVPN Rust CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Capture Rust compiler version
        id: rust-version
        shell: bash
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-
      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.rust-version.outputs.hash }}-
            ${{ runner.os }}-cargo-target-
      - name: Install native nftables dependencies
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev libnftnl-dev libglib2.0-dev libgtk-3-dev libdbus-1-dev pkg-config
      - name: Format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
