name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      build_release_native:
        description: 'Build native Rust library with --release (recommended for performance)'
        type: boolean
        default: true

jobs:
  build-apk:
    name: Build RVPN Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        id: setup-ndk
        run: |
          echo "Locating installed Android NDK..."
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi

      - name: Cache cargo-ndk binary
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v3

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build native Rust libraries (.so)
        run: |
          mkdir -p apps/rvpn-android/android/app/src/main/jniLibs
          FLAG="${{ inputs.build_release_native == true && '--release' || '' }}"
          echo "Building native libraries with flags: $FLAG"
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -t armeabi-v7a \
            -o apps/rvpn-android/android/app/src/main/jniLibs \
            build --package rvpn-android $FLAG

      - name: Verify compiled native libraries
        run: |
          echo "Generated native libraries:"
          ls -lh apps/rvpn-android/android/app/src/main/jniLibs/*/*.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: apps/rvpn-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rvpn-android-debug
          path: apps/rvpn-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
