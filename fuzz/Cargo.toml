[workspace]
resolver="3"

[package]
name="rvpn-fuzz"
version="0.0.0"
publish=false
edition="2024"

[package.metadata]
cargo-fuzz=true

[dependencies]
arbitrary={version="1.4.2"}
bytes={version="1.12.1"}
libfuzzer-sys={version="0.4.13"}

[dependencies.rvpn-crypto]
path="../crates/rvpn-crypto"

[dependencies.rvpn-protocol]
path="../crates/rvpn-protocol"

[[bin]]
name="packet_decode"
path="fuzz_targets/packet_decode.rs"
test=false
doc=false
bench=false

[[bin]]
name="handshake_decode"
path="fuzz_targets/handshake_decode.rs"
test=false
doc=false
bench=false

[[bin]]
name="handshake_accept"
path="fuzz_targets/handshake_accept.rs"
test=false
doc=false
bench=false

[[bin]]
name="obfuscation_unwrap"
path="fuzz_targets/obfuscation_unwrap.rs"
test=false
doc=false
bench=false

[[bin]]
name="certificate_decode_verify"
path="fuzz_targets/certificate_decode_verify.rs"
test=false
doc=false
bench=false
